# ============================================================
# PonyImage 生产环境 Nginx 配置示例
#
# 使用方式:
#   1. 复制到 /etc/nginx/conf.d/ponyimage.conf（或 sites-available 后软链）
#   2. 修改 server_name 与 root 路径
#   3. nginx -t && systemctl reload nginx
#
# 安全要点:
#   - uploads / thumbs 目录禁止执行与解析 PHP
#   - runtime / db / config / includes / views / tools 目录完全禁止访问
#   - 隐藏版本号，添加安全响应头
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name image.example.com;          # TODO: 改为你的域名

    # 生产建议启用 HTTPS（certbot --nginx 自动配置），此处仅示意 80 端口

    root /var/www/ponyimage;                # TODO: 项目根目录
    index index.php;

    # 上传大小限制（需 >= config.max_file_size，并同步 php.ini 的 upload_max_filesize）
    client_max_body_size 20m;

    # 隐藏 Nginx 版本
    server_tokens off;

    # ---------- 目录访问控制 ----------

    # 运行时目录（日志/限流/会话）：完全禁止
    location ^~ /runtime/ {
        deny all;
        return 404;
    }

    # SQLite 数据库文件：完全禁止
    location ^~ /db/ {
        deny all;
        return 404;
    }

    # 配置目录：完全禁止
    location ^~ /config/ {
        deny all;
        return 404;
    }

    # 后端类与视图片段：完全禁止
    location ^~ /includes/ {
        deny all;
        return 404;
    }
    location ^~ /views/ {
        deny all;
        return 404;
    }

    # 命令行工具：完全禁止
    location ^~ /tools/ {
        deny all;
        return 404;
    }

    # 敏感文件：SQL / Markdown / 示例配置 / 隐藏文件
    location ~* \.(sql|md|log|ini|example|bak|old|swp)$ {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # ---------- 上传目录安全（核心）----------

    # uploads / thumbs 内禁止执行任何 PHP（即使被绕过校验传入了 PHP 文件也只当静态数据处理）
    location ~* ^/(uploads|thumbs)/.*\.php$ {
        deny all;
        return 404;
    }

    # uploads / thumbs 仅允许图片扩展名访问，其余一律 404
    # （随机文件名 + 白名单，有效阻断恶意文件被执行或下载）
    location ~* ^/(uploads|thumbs)/ {
        location ~* \.(jpe?g|png|gif|webp)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        return 404;
    }

    # ---------- 静态资源 ----------

    location ~* ^/assets/.+\.(css|js|woff2?|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- PHP 处理 ----------

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # TODO: 按实际 PHP-FPM 版本修改
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_index index.php;
        fastcgi_read_timeout 60s;

        # 不信任客户端伪造的头
        fastcgi_param HTTP_X_FORWARDED_FOR "";
    }

    # ---------- 其余请求交给入口 ----------

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
}
